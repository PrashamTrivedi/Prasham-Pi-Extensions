<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Pi Fabric illustrative terminal UI preview</title><desc id="desc">A dark terminal overview showing a compact widget, comparison cards and a team inspector. It is labeled as a simulation.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#132b3b"/><stop offset=".58" stop-color="#09131c"/><stop offset="1" stop-color="#061018"/></linearGradient><linearGradient id="glow"><stop stop-color="#55d9e5" stop-opacity=".3"/><stop offset="1" stop-color="#55d9e5" stop-opacity="0"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="10"/></filter><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.display{font-family:Georgia,serif}.muted{fill:#91a1b3}.dim{fill:#586a7d}.cyan{fill:#5bd9e6}.green{fill:#8be28a}.amber{fill:#f4c46a}.white{fill:#eaf0f7}.stroke{stroke:#35485a}</style></defs><rect width="1200" height="630" fill="url(#bg)"/><ellipse cx="190" cy="-20" rx="410" ry="210" fill="url(#glow)"/><text x="62" y="67" class="cyan" font-size="15" letter-spacing="3">PI FABRIC · UI PREVIEW</text><text x="60" y="126" class="display white" font-size="55">Parallel work, visible.</text><text x="62" y="158" class="muted" font-size="16">Illustrative terminal surfaces for compact status, reported-result comparison, and team inspection.</text><rect x="940" y="52" width="198" height="32" rx="16" fill="#251e11" stroke="#6e5d38"/><text x="960" y="73" class="amber" font-size="12">SIMULATION · NO LIVE DATA</text><!-- compact --><rect x="60" y="206" width="326" height="327" rx="12" fill="#0d1720" stroke="#405468"/><circle cx="81" cy="229" r="5" fill="#ff7885"/><circle cx="98" cy="229" r="5" fill="#f3c366"/><circle cx="115" cy="229" r="5" fill="#85de91"/><text x="140" y="234" class="muted" font-size="12">compact widget</text><line x1="60" y1="250" x2="386" y2="250" class="stroke"/><text x="83" y="286" class="cyan" font-size="14">◆ PI FABRIC</text><text x="83" y="311" class="muted" font-size="12">1 running · 1 waiting · 2 done</text><rect x="78" y="329" width="290" height="137" rx="4" fill="#081018" stroke="#294153"/><text x="94" y="359" class="cyan" font-size="13">●  Map signals   checking boundaries</text><text x="94" y="390" class="amber" font-size="13">◌  Gather notes  awaiting evidence</text><text x="94" y="421" class="green" font-size="13">✓  Check tests   reported complete</text><text x="82" y="505" class="dim" font-size="12">Bounded rows preserve editor space.</text><!-- comparison --><rect x="411" y="206" width="728" height="181" rx="12" fill="#0d1720" stroke="#405468"/><text x="434" y="235" class="cyan" font-size="13">◆ FABRIC · RESULTS READY</text><text x="955" y="235" class="dim" font-size="12">comparison cards</text><rect x="432" y="254" width="330" height="110" rx="5" fill="#09131b" stroke="#304555"/><rect x="787" y="254" width="330" height="110" rx="5" fill="#09131b" stroke="#304555"/><text x="450" y="282" class="green" font-size="14">✓ Boundary scan · done</text><text x="450" y="308" class="muted" font-size="12">Fixture report: two seams for review.</text><text x="450" y="342" class="dim" font-size="11">model: sample-mini · agent-reported</text><text x="805" y="282" class="amber" font-size="14">◌ Copy review · waiting</text><text x="805" y="308" class="muted" font-size="12">A concise handoff is pending.</text><text x="805" y="342" class="dim" font-size="11">model: sample-core · agent-reported</text><!-- inspector --><rect x="411" y="410" width="728" height="151" rx="12" fill="#0d1720" stroke="#405468"/><text x="434" y="438" class="cyan" font-size="13">◆ PI FABRIC — LIVE TEAM</text><text x="434" y="461" class="dim" font-size="11">team inspector</text><line x1="630" y1="451" x2="630" y2="542" class="stroke"/><rect x="428" y="475" width="185" height="29" fill="#112938"/><text x="441" y="495" class="cyan" font-size="12">› ★ ●  Map signals</text><text x="441" y="523" class="green" font-size="12">  ★ ✓  Check tests</text><text x="653" y="479" class="cyan" font-size="12">[activity]</text><text x="733" y="479" class="muted" font-size="12">result   patch   compare</text><line x1="653" y1="490" x2="1116" y2="490" class="stroke"/><text x="653" y="515" class="muted" font-size="12">10:14:02 · activity</text><text x="653" y="536" class="white" font-size="12">Inspecting the fictional task outline.</text><text x="60" y="587" class="muted" font-size="13">Interactive HTML companion includes keyboard-friendly tabs and fake-agent pinning.</text><text x="60" y="610" class="dim" font-size="12">All names, identifiers, reports, and patches are invented placeholders.</text></svg>